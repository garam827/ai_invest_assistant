name: Deploy React site

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit+push the built docs/ assets for GitHub Pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - working-directory: web
        run: npm ci

      # vite.config.ts sets build.outDir to ../docs (repo root's docs/) with emptyOutDir:
      # false (so a build never touches docs/reports/ or docs/data/, which recommend.yml
      # owns -- see static_export.py). But that also means Vite's own content-hashed
      # bundles (docs/assets/index-<hash>.js/css) never get cleaned between builds, since
      # emptyOutDir:false skips its usual pre-build wipe entirely -- so docs/assets/ (which
      # *is* exclusively this app's output) is cleared by hand first.
      - name: Clean previous build output
        run: rm -rf docs/assets

      - working-directory: web
        run: npm run build

      # recommend.yml's daily cron also commits into docs/ (reports + data), so rebase onto
      # the latest master before pushing to avoid a rejected non-fast-forward push if both
      # workflows happen to run close together.
      - name: Commit + push built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets docs/favicon.svg
          if git diff --cached --quiet; then
            echo "No change to the built site, nothing to publish."
            exit 0
          fi
          git commit -m "Deploy React site ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin master
          git push
