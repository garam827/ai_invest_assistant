name: Daily data collection

on:
  schedule:
    # 22:30 UTC ≈ 18:30 EDT / 17:30 EST — safely after the 16:00 ET market close either way.
    # Day-of-week mask is UTC, but the mental model here is "weekday mornings in KST" —
    # UTC Sun-Thu (0-4) is KST Mon-Fri 07:30 next day (UTC+9 crosses midnight). Using UTC's
    # own Mon-Fri (1-5) instead would land on KST Tue-Sat: skips Monday, adds an unwanted
    # Saturday. Sunday's run just re-confirms Friday's close (no new US trading day yet),
    # which doubles as the Monday-morning catch-up.
    # GitHub Actions cron is UTC-only and best-effort (can be delayed under platform load).
    - cron: "30 22 * * 0-4"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Sync S&P 500 + asset-class OHLCV data
        run: python data_fetcher.py update
