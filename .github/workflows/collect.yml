name: Daily data collection

on:
  schedule:
    # 21:57 UTC ≈ 17:57 EDT (117min after the 16:00 ET close) / 16:57 EST (57min after) —
    # thinner buffer than the original 22:30 UTC target during EST (Nov-Mar), traded off
    # deliberately for an earlier KST landing time; if yfinance data lags on some winter
    # day, run_daily_update just finds no new row and self-heals on the next run.
    # Minute :57 is deliberately non-round (not :00/:15/:30/:45) — GitHub Actions queues
    # scheduled workflows more heavily at those popular marks, and best-effort delay has
    # been observed up to ~1hr (e.g. a 22:30 target firing at 23:31 UTC). This is a GitHub
    # platform characteristic, not something a cron expression can fully avoid, only reduce.
    # Day-of-week mask is UTC Mon-Fri (1-5), which lands on KST Tue-Sat ~06:57 next day
    # (UTC+9 crosses midnight) — NOT KST Mon-Fri. That's intentional, not a bug: a KST
    # Monday-morning run would need a Sunday UTC trigger, but at that point no new US
    # trading day has happened yet (still Friday's close), so it'd just be a rerun of
    # data already sent — not worth an extra day of runs just to fill a slot with no new data.
    - cron: "57 21 * * 1-5"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

concurrency:
  group: drive-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # First pass ~45-60min + up to 3 retries 30min apart; leave headroom under the 6h cap.
    timeout-minutes: 330
    env:
      COLLECTION_RUN_ATTEMPTS: ${{ vars.COLLECTION_RUN_ATTEMPTS || '4' }}
      COLLECTION_RUN_RETRY_DELAY_SEC: ${{ vars.COLLECTION_RUN_RETRY_DELAY_SEC || '1800' }}
      COLLECTION_WORKERS: ${{ vars.COLLECTION_WORKERS || '3' }}
      COLLECTION_RETRY_ROUNDS: ${{ vars.COLLECTION_RETRY_ROUNDS || '1' }}
      COLLECTION_RETRY_DELAY_SEC: ${{ vars.COLLECTION_RETRY_DELAY_SEC || '30' }}
      YFINANCE_REQUEST_DELAY_SEC: ${{ vars.YFINANCE_REQUEST_DELAY_SEC || '0.5' }}
      YFINANCE_RATE_LIMIT_COOLDOWN_SEC: ${{ vars.YFINANCE_RATE_LIMIT_COOLDOWN_SEC || '60' }}
      GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e .

      - name: Verify data-quality regression checks
        run: python -m unittest discover -s tests -v

      # Yahoo sometimes serves the latest session as an all-NaN placeholder for a few hours
      # after the close; validation rightly rejects it and the batch fails. Retrying within
      # this same run (rather than dispatching a new one) keeps recommend.yml's workflow_run
      # chain intact: it fires once, on this run's final conclusion. Collection is per-ticker
      # incremental, so a retry only refetches what is still missing. Retries stop once US
      # market hours approach (13:00 UTC) so an intraday bar can never be saved as a close.
      - name: Sync S&P 500 + asset-class OHLCV data (auto-retry on failure)
        run: |
          attempt=1
          while true; do
            echo "Collection attempt ${attempt}/${COLLECTION_RUN_ATTEMPTS}"
            if python -m invest_assistant.pipelines.collect update; then
              exit 0
            fi
            if [ "${attempt}" -ge "${COLLECTION_RUN_ATTEMPTS}" ]; then
              echo "::error::Collection failed after ${attempt} attempts"
              exit 1
            fi
            resume_hour=$(date -u -d "+${COLLECTION_RUN_RETRY_DELAY_SEC} seconds" +%-H)
            if [ "${resume_hour}" -ge 13 ] && [ "${resume_hour}" -lt 22 ]; then
              echo "::error::Next retry would start at ${resume_hour}h UTC, inside US market hours; giving up"
              exit 1
            fi
            echo "::warning::Collection attempt ${attempt} failed; retrying in ${COLLECTION_RUN_RETRY_DELAY_SEC}s"
            sleep "${COLLECTION_RUN_RETRY_DELAY_SEC}"
            attempt=$((attempt + 1))
          done
