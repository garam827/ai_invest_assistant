name: Daily data collection

on:
  schedule:
    # 22:30 UTC ≈ 18:30 EDT / 17:30 EST — safely after the 16:00 ET market close either way.
    # Day-of-week mask is UTC Mon-Fri (1-5), which lands on KST Tue-Sat 07:30 next day
    # (UTC+9 crosses midnight) — NOT KST Mon-Fri. That's intentional, not a bug: a KST
    # Monday-morning run would need a Sunday UTC trigger, but at that point no new US
    # trading day has happened yet (still Friday's close), so it'd just be a rerun of
    # data already sent — not worth an extra day of runs just to fill a slot with no new data.
    # GitHub Actions cron is UTC-only and best-effort — actual fire time has been observed
    # up to ~1hr late (e.g. 22:30 target firing at 23:31 UTC), especially at busy round-number
    # times like :30. This is a GitHub platform characteristic, not something fixable here.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab for testing

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Sync S&P 500 + asset-class OHLCV data
        run: python data_fetcher.py update
