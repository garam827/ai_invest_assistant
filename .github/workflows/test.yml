name: Python regression tests

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "apps/streamlit/**"
      - "research/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INVEST_ASSISTANT_HOME: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
