name: Asset-class recommendations

on:
  # Chains after "Daily data collection" finishes, rather than a fixed time offset — more
  # robust than guessing how long collection takes. Only proceeds if that run succeeded
  # (see the job-level `if` below); per-ticker staleness is still re-checked in code
  # (recommendation_engine._is_data_fresh) since a "successful" collection run can still
  # have silently skipped individual tickers.
  workflow_run:
    workflows: ["Daily data collection"]
    types: [completed]
  workflow_dispatch: # allows manual "Run workflow" from the Actions tab for testing
    inputs:
      skip_llm_and_news:
        description: "Exa 뉴스/OpenRouter LLM 호출 생략(규칙 기반 설명으로 대체) — 파이프라인/리포트/텔레그램 배관만 확인할 때 API 사용량 절약"
        type: boolean
        default: true
      is_test:
        description: "테스트/샘플 리포트 발행 — 켜져 있으면 리포트 파일명 끝에 _test 접미어를 붙여 그날의 실제 리포트를 덮어쓰지 않음"
        type: boolean
        default: true

jobs:
  recommend:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit+push the generated docs/reports/ page for GitHub Pages
    env:
      GOOGLE_OAUTH_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_JSON }}
      GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SKIP_LLM_AND_NEWS: ${{ github.event.inputs.skip_llm_and_news }}
      IS_TEST_REPORT: ${{ github.event.inputs.is_test }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Generate 매수/HOLD/매도 recommendations (representative asset classes only)
        run: python recommendation_engine.py

      # report_builder.py writes the day's combined report to docs/reports/{date}.html, and
      # static_export.py writes the React site's data (docs/data/*.json, overwritten daily,
      # not date-stamped) as side effects of the step above; commit+push both so GitHub Pages
      # (serving the docs/ folder) publishes them. A no-op (no commit) if there were no
      # results (e.g. every ticker was skipped for stale data).
      - name: Publish daily report + static site data to GitHub Pages
        run: |
          if [ ! -d docs/reports ]; then
            echo "No report generated (empty results), nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports
          if [ -d docs/data ]; then
            git add docs/data
          fi
          if [ "${IS_TEST_REPORT}" = "true" ]; then
            git diff --cached --quiet || git commit -m "Add test report $(date -u +%Y-%m-%d)"
          else
            git diff --cached --quiet || git commit -m "Add daily report $(date -u +%Y-%m-%d)"
          fi
          # --- 수정 및 추가 부분 시작 ---  
          # 원격 저장소의 최신 변경사항을 가져와 내 커밋 위에 재배치(rebase)합니다.  
          # 이렇게 하면 'rejected' 에러를 방지하고 커밋 히스토리를 깔끔하게 유지할 수 있습니다.  
          git pull --rebase origin master   
          git push  
          # --- 수정 및 추가 부분 끝 --- 
